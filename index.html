<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Cita - Peluquería</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        input[type="date"] { background: #fff; font-weight: 500; }
        .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .slot { padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; text-align: center; font-weight: 600; font-size: 15px; }
        .slot:disabled { background: #e0e0e0; color: #888; cursor: not-allowed; }
        
        .loading-container { text-align: center; padding: 30px; grid-column: span 2; }
        .spinner { width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid #007bff; border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 320px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .btn-primary { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-secondary { background: #6c757d; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Reserva tu Cita</h2>
    <label for="fecha">Selecciona el día:</label>
    <input type="date" id="fecha" onchange="cargarHoras(true)">

    <div id="lista-horas" class="slots"></div>
</div>

<div id="modalReserva" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#333;">Tus Datos</h3>
        <p id="infoCitaSeleccionada" style="color: #666; font-size: 14px;"></p>
        <label>Nombre y Apellido:</label>
        <input type="text" id="nombreCliente" placeholder="Ej. Juan Pérez">
        <label>Teléfono:</label>
        <input type="tel" id="telefonoCliente" placeholder="Ej. 600000000">
        <button class="btn-primary" onclick="confirmarReserva()">Confirmar Cita</button>
        <button class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/library/d/1H15wPJxe2D7wG5e4NtwgmPkgq_2gNKnD0nPVxGv4uaM6TFiWg4TEgWIw/4"; // <-- PEGA TU URL AQUÍ
    let horaSeleccionada = "";

    document.getElementById('fecha').valueAsDate = new Date();
    cargarHoras(true);

    async function cargarHoras(forzarRecarga = false) {
        const fecha = document.getElementById('fecha').value;
        const contenedor = document.getElementById('lista-horas');
        
        contenedor.innerHTML = `
            <div class="loading-container">
                <div class="spinner"></div>
                <span style="color: #666; font-size: 13px;">Cargando horarios...</span>
            </div>
        `;

        try {
            let ocupadas = [];
            let cacheKey = "cache_" + fecha;
            let cacheTimeKey = "cache_time_" + fecha;
            let ahoraMs = new Date().getTime();

            if (!forzarRecarga && sessionStorage.getItem(cacheKey) && (ahoraMs - sessionStorage.getItem(cacheTimeKey) < 15000)) {
                ocupadas = JSON.parse(sessionStorage.getItem(cacheKey));
            } else {
                let response = await fetch(`${API_URL}?action=getDisponibilidad&fecha=${fecha}`);
                ocupadas = await response.json();
                sessionStorage.setItem(cacheKey, JSON.stringify(ocupadas));
                sessionStorage.setItem(cacheTimeKey, ahoraMs);
            }

            contenedor.innerHTML = "";
            
            let inicio = 11 * 60 + 30;
            let fin = 23 * 60;
            let ahora = new Date();
            let esHoy = (fecha === ahora.toISOString().split('T')[0]);
            let minutosActuales = ahora.getHours() * 60 + ahora.getMinutes();

            for (let m = inicio; m <= fin; m += 30) {
                let h = Math.floor(m / 60);
                let min = m % 60;
                let horaStr = (h < 10 ? "0" + h : h) + ":" + (min === 0 ? "00" : min);

                let ocupadaInfo = ocupadas.find(o => o.hora === horaStr);
                let estaOcupada = !!ocupadaInfo;

                let pasadaDeHora = false;
                if (esHoy && (m <= minutosActuales + 60)) {
                    pasadaDeHora = true;
                }

                let btn = document.createElement('button');
                btn.className = "slot";
                btn.innerText = horaStr;

                if (estaOcupada || pasadaDeHora) {
                    btn.disabled = true;
                    if(ocupadaInfo && ocupadaInfo.estado === "BloqueadoPeluquero") {
                        btn.innerText = horaStr + " 🚫";
                    } else if(ocupadaInfo && ocupadaInfo.estado === "Reservado") {
                        btn.innerText = horaStr + " ❌";
                    } else {
                        btn.style.display = "none";
                    }
                } else {
                    btn.onclick = () => abrirModal(horaStr);
                }

                if (btn.style.display !== "none") {
                    contenedor.appendChild(btn);
                }
            }
        } catch (error) {
            contenedor.innerHTML = "<p style='grid-column: span 2; text-align: center; color: #dc3545;'>Error al cargar.</p>";
        }
    }

    function abrirModal(hora) {
        horaSeleccionada = hora;
        document.getElementById('infoCitaSeleccionada').innerText = `Día: ${document.getElementById('fecha').value} | Hora: ${hora}`;
        document.getElementById('modalReserva').style.display = 'flex';
    }

    function cerrarModal() {
        document.getElementById('modalReserva').style.display = 'none';
    }

    async function confirmarReserva() {
        const nombre = document.getElementById('nombreCliente').value.trim();
        const telefono = document.getElementById('telefonoCliente').value.trim();
        const fecha = document.getElementById('fecha').value;

        if (!nombre || !telefono) {
            alert("Rellena nombre y teléfono.");
            return;
        }

        let datos = { action: "crearReserva", fecha: fecha, hora: horaSeleccionada, nombre: nombre, telefono: telefono };

        try {
            let response = await fetch(API_URL, { method: "POST", body: JSON.stringify(datos) });
            let resultado = await response.json();
            
            if (resultado.status === "success") {
                alert("¡Cita reservada con éxito!");
                cerrarModal();
                document.getElementById('nombreCliente').value = "";
                document.getElementById('telefonoCliente').value = "";
                sessionStorage.clear(); // Limpia caché para forzar datos nuevos al instante
                cargarHoras(true);
            }
        } catch (error) {
            alert("Error de conexión.");
        }
    }
</script>

</body>
</html>
