<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Peluquería</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        .slot-admin { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin-top: 8px; background: #e9ecef; border-radius: 5px; }
        .btn-accion { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; color: white; width: auto; margin: 0; }
        .btn-bloquear { background: #dc3545; }
        .btn-desbloquear { background: #28a745; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel Peluquero</h2>
    
    <!-- Login -->
    <div id="loginSection">
        <label>Contraseña:</label>
        <input type="password" id="passAdmin" placeholder="Introduce la contraseña">
        <button onclick="verificarLogin()" style="background: #007bff; color: white; margin-top: 15px;">Entrar</button>
    </div>

    <!-- Panel de Control (Oculto hasta hacer login) -->
    <div id="panelSection" class="hidden">
        <label for="fechaAdmin">Selecciona el día a gestionar:</label>
        <input type="date" id="fechaAdmin" onchange="cargarAdminData()">
        
        <div id="listaAdminHoras" style="margin-top: 15px;"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx7KQzKfXQH3yxOnP26nM3BNDOG_7adSEpS8rC1k1TcZv2pGAzLLuPdKj5WEPOIk_0/exec"; // <-- PEGA TU MISMA URL DE APPS SCRIPT AQUÍ
    let passwordActual = "";

    async function verificarLogin() {
        passwordActual = document.getElementById('passAdmin').value;
        const fecha = new Date().toISOString().split('T')[0];
        
        // Comprobamos si la contraseña es correcta pidiendo los datos
        let response = await fetch(`${API_URL}?action=getAdminData&pass=${passwordActual}&fecha=${fecha}`);
        let data = await response.json();

        if (data.error) {
            alert("Contraseña incorrecta");
        } else {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('panelSection').style.display = 'block';
            document.getElementById('fechaAdmin').valueAsDate = new Date();
            cargarAdminData();
        }
    }

    async function cargarAdminData() {
        const fecha = document.getElementById('fechaAdmin').value;
        const contenedor = document.getElementById('listaAdminHoras');
        contenedor.innerHTML = "Cargando citas...";

        let response = await fetch(`${API_URL}?action=getAdminData&pass=${passwordActual}&fecha=${fecha}`);
        let registros = await response.json();

        contenedor.innerHTML = "";

        let inicio = 11 * 60 + 30; // 11:30
        let fin = 23 * 60; // 23:00

        for (let m = inicio; m <= fin; m += 30) {
            let h = Math.floor(m / 60);
            let min = m % 60;
            let horaStr = (h < 10 ? "0" + h : h) + ":" + (min === 0 ? "00" : min);

            let registroHora = registros.find(r => r.fecha === fecha && r.hora === horaStr);
            
            let div = document.createElement('div');
            div.className = "slot-admin";

            let textoEstado = horaStr + " - Libre";
            let btnHtml = `<button class="btn-accion btn-bloquear" onclick="toggleBloqueo('${horaStr}', 'bloquear')">Bloquear</button>`;

            if (registroHora) {
                if (registroHora.estado === "Reservado") {
                    textoEstado = `${horaStr} - 👤 ${registroHora.nombre} (${registroHora.telefono})`;
                    btnHtml = `<button class="btn-accion btn-bloquear" onclick="toggleBloqueo('${horaStr}', 'bloquear')">Anular Cita</button>`;
                } else if (registroHora.estado === "BloqueadoPeluquero") {
                    textoEstado = `${horaStr} - 🚫 Bloqueado`;
                    btnHtml = `<button class="btn-accion btn-desbloquear" onclick="toggleBloqueo('${horaStr}', 'desbloquear')">Desbloquear</button>`;
                }
            }

            div.innerHTML = `<span>${textoEstado}</span>${btnHtml}`;
            contenedor.appendChild(div);
        }
    }

    async function toggleBloqueo(hora, accion) {
        const fecha = document.getElementById('fechaAdmin').value;

        let datos = {
            action: "toggleBloqueo",
            pass: passwordActual,
            fecha: fecha,
            hora: hora
        };

        let response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(datos)
        });
        let resultado = await response.json();

        if (resultado.status === "success") {
            cargarAdminData();
        } else {
            alert("Error al actualizar");
        }
    }
</script>

</body>
</html>
