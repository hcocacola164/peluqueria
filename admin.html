<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Peluquería</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 450px; box-sizing: border-box; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
        input, button { width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        input[type="date"] { background: #fff; font-weight: 500; }
        
        .slot-admin { display: flex; justify-content: space-between; align-items: center; padding: 12px; margin-top: 10px; background: #f8f9fa; border-radius: 8px; border: 1px solid #eee; font-size: 14px; }
        .btn-accion { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: 600; width: auto; margin: 0; font-size: 13px; }
        .btn-bloquear { background: #dc3545; }
        .btn-desbloquear { background: #28a745; }
        .btn-dia { background: #343a40; color: white; margin-top: 15px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; padding: 12px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel Peluquero</h2>
    
    <div id="loginSection">
        <label>Contraseña:</label>
        <input type="password" id="passAdmin" placeholder="Introduce la contraseña">
        <button onclick="verificarLogin()" style="background: #007bff; color: white; margin-top: 15px; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">Entrar</button>
    </div>

    <div id="panelSection" class="hidden">
        <label for="fechaAdmin">Selecciona el día a gestionar:</label>
        <input type="date" id="fechaAdmin" onchange="cargarAdminData()">
        
        <button id="btnDiaEntero" class="btn-dia" onclick="toggleDiaCompleto()">Bloquear Día Entero</button>

        <div id="listaAdminHoras" style="margin-top: 20px;"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx7KQzKfXQH3yxOnP26nM3BNDOG_7adSEpS8rC1k1TcZv2pGAzLLuPdKj5WEPOIk_0/exec"; // <-- PEGA TU URL DE APPS SCRIPT AQUÍ
    let passwordActual = "";
    let diaBloqueadoActual = false;

    async function verificarLogin() {
        passwordActual = document.getElementById('passAdmin').value;
        const fecha = new Date().toISOString().split('T')[0];
        
        let response = await fetch(`${API_URL}?action=getAdminData&pass=${passwordActual}&fecha=${fecha}`);
        let data = await response.json();

        if (data.error) {
            alert("Contraseña incorrecta");
        } else {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('panelSection').style.display = 'block';
            document.getElementById('fechaAdmin').valueAsDate = new Date();
            cargarAdminData();
        }
    }

    async function cargarAdminData() {
        const fecha = document.getElementById('fechaAdmin').value;
        const contenedor = document.getElementById('listaAdminHoras');
        contenedor.innerHTML = "Cargando citas...";

        let response = await fetch(`${API_URL}?action=getAdminData&pass=${passwordActual}&fecha=${fecha}`);
        let registros = await response.json();

        contenedor.innerHTML = "";

        let inicio = 11 * 60 + 30; // 11:30
        let fin = 23 * 60; // 23:00

        let totalBloqueadosPeluquero = 0;
        let totalHoras = 0;

        for (let m = inicio; m <= fin; m += 30) {
            let h = Math.floor(m / 60);
            let min = m % 60;
            let horaStr = (h < 10 ? "0" + h : h) + ":" + (min === 0 ? "00" : min);
            totalHoras++;

            let registroHora = registros.find(r => r.fecha === fecha && r.hora === horaStr);
            
            let div = document.createElement('div');
            div.className = "slot-admin";

            let textoEstado = `${horaStr} - 🟢 Libre`;
            let btnHtml = `<button class="btn-accion btn-bloquear" onclick="toggleBloqueo('${horaStr}')">Bloquear</button>`;

            if (registroHora) {
                if (registroHora.estado === "Reservado") {
                    textoEstado = `${horaStr} - 👤 ${registroHora.nombre} (${registroHora.telefono})`;
                    btnHtml = `<button class="btn-accion btn-bloquear" onclick="toggleBloqueo('${horaStr}')">Anular Cita</button>`;
                } else if (registroHora.estado === "BloqueadoPeluquero") {
                    textoEstado = `${horaStr} - 🚫 Bloqueado`;
                    btnHtml = `<button class="btn-accion btn-desbloquear" onclick="toggleBloqueo('${horaStr}')">Desbloquear</button>`;
                    totalBloqueadosPeluquero++;
                }
            }

            div.innerHTML = `<span>${textoEstado}</span>${btnHtml}`;
            contenedor.appendChild(div);
        }

        const btnDia = document.getElementById('btnDiaEntero');
        if (totalBloqueadosPeluquero >= (totalHoras / 2)) {
            diaBloqueadoActual = true;
            btnDia.innerText = "🔓 Desbloquear Día Entero";
            btnDia.style.background = "#28a745";
        } else {
            diaBloqueadoActual = false;
            btnDia.innerText = "🔒 Bloquear Día Entero";
            btnDia.style.background = "#343a40";
        }
    }

    async function toggleBloqueo(hora) {
        const fecha = document.getElementById('fechaAdmin').value;

        let datos = {
            action: "toggleBloqueo",
            pass: passwordActual,
            fecha: fecha,
            hora: hora
        };

        await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(datos)
        });
        cargarAdminData();
    }

    async function toggleDiaCompleto() {
        const fecha = document.getElementById('fechaAdmin').value;
        let nuevoEstadoBloqueo = !diaBloqueadoActual;

        let datos = {
            action: "toggleBloqueoDia",
            pass: passwordActual,
            fecha: fecha,
            bloquear: nuevoEstadoBloqueo
        };

        let response = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(datos)
        });
        let resultado = await response.json();

        if (resultado.status === "success") {
            cargarAdminData();
        } else {
            alert("Error al actualizar el día.");
        }
    }
</script>

</body>
</html>
